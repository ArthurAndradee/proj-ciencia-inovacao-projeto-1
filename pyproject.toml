[project]
name = "arc-critic-experiment"
version = "0.1.0"
description = "Sintese de programas para ARC-AGI-1: baseline self-debugging vs. intervencao multi-agente com Critico oraculo"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
arc-exp = "arc_experiment.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
